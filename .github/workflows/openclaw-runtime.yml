# ---------------------------------------------------------------------------
# OpenClaw runtime on GitHub Actions
#
# A serverless replacement for the long-lived WSL/ACA/AKS Gateway. Instead of
# keeping a Gateway process running 24/7, GitHub spins up a fresh Ubuntu runner
# every 15 minutes, restores the previous OpenClaw state from the Actions cache,
# fires any cron jobs that are due, saves the updated state back to the cache,
# and shuts down — typically in 2-3 minutes. Zero infrastructure cost.
#
# State model:
#   - $HOME/.openclaw is restored/saved via actions/cache (rolling key).
#   - On a cache miss, optional seed archive (OPENCLAW_SEED_PATH) is extracted.
#   - Secrets are injected from GitHub Secrets, never committed in plaintext.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   (all optional — only set the ones your jobs use)
#   GROQ_API_KEY              Groq API key for optillm/groq fallbacks
#   OPENCLAW_GATEWAY_TOKEN    pin a fixed gateway token (else auto-generated)
#   TELEGRAM_BOT_TOKEN        bot token for workflow-level run notifications
#   TELEGRAM_CHAT_ID          chat/user id to notify
#
# Optional repository variables (Settings → Secrets and variables → Actions → Variables):
#   OPENCLAW_SEED_PATH        seed archive path (default: seed/openclaw-seed.tar.gz)
#   OPENCLAW_GHA_DRIVE        manual | scheduler (default: manual)
#   OPENCLAW_ENABLE_REDIS     run a Redis sidecar  (default: true)
#   OPENCLAW_ENABLE_SEARXNG   run a SearXNG sidecar (default: true)
#
# Sidecars (parity with the WSL Docker runtime):
#   - Redis (redis:7-alpine) on 127.0.0.1:6379 with AOF persisted under the cached
#     ~/.openclaw/redis-data, so queues/state carry over between ticks.
#   - SearXNG (searxng/searxng:latest) on :8080, fed searxng/settings.yml from the
#     repo. The seeded MCP config reaches it at http://172.17.0.1:8080 (docker0).
#
# NOTE: Scheduled workflows only run from the repository's DEFAULT branch, and
# GitHub may delay cron triggers under load (so "*/15" is best-effort, not exact).
# Because the cache can contain credentials/sessions, use a PRIVATE repository.
# ---------------------------------------------------------------------------
name: OpenClaw Runtime

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:          # allow manual execution from the Actions tab
    inputs:
      drive:
        description: 'Cron drive mode'
        type: choice
        default: manual
        options: [manual, scheduler]

# Never run two ticks at once — overlapping runs would corrupt the shared state.
concurrency:
  group: openclaw-runtime
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  OPENCLAW_GATEWAY_PORT: '18789'
  OPENCLAW_SEED_PATH: ${{ vars.OPENCLAW_SEED_PATH || 'seed/openclaw-seed.tar.gz' }}
  OPENCLAW_GHA_DRIVE: ${{ inputs.drive || vars.OPENCLAW_GHA_DRIVE || 'manual' }}
  OPENCLAW_ENABLE_REDIS: ${{ vars.OPENCLAW_ENABLE_REDIS || 'true' }}
  OPENCLAW_ENABLE_SEARXNG: ${{ vars.OPENCLAW_ENABLE_SEARXNG || 'true' }}

jobs:
  tick:
    name: OpenClaw cron tick
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level env so the Telegram step's `if:` can test for configured secrets
    # (step-level env is not visible to `if:` expressions).
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore OpenClaw state
        id: state-cache
        uses: actions/cache@v4
        with:
          path: ~/.openclaw
          # Rolling cache: the key is unique per run so a new cache is always
          # saved at the end, while restore-keys pulls the most recent prior state.
          key: openclaw-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            openclaw-state-

      - name: Install OpenClaw (npm)
        run: |
          npm install -g openclaw
          openclaw --version || node -v

      - name: Seed state on first run (cache miss)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.openclaw"
          if [ -f "$HOME/.openclaw/openclaw.json" ]; then
            echo "Existing state restored from cache — skipping seed."
          elif [ -f "$OPENCLAW_SEED_PATH" ]; then
            echo "Cache miss — extracting seed archive: $OPENCLAW_SEED_PATH"
            tar xzf "$OPENCLAW_SEED_PATH" -C "$HOME/.openclaw"
          else
            echo "Cache miss and no seed archive present — starting from a fresh state."
          fi

      - name: Start Redis, SearXNG & CRW sidecars
        run: |
          set -euo pipefail

          # Pull latest images to ensure we always run the most recent versions
          echo "Pulling latest images..."
          docker pull redis:7-alpine >/dev/null 2>&1 || true
          docker pull searxng/searxng:latest >/dev/null 2>&1 || true
          docker pull ghcr.io/us/crw:latest >/dev/null 2>&1 || true
          echo "Latest images pulled (or already cached)"

          # Redis — same role as the WSL/ACA/AKS Redis sidecar. Published on
          # loopback:6379 so the host-side OpenClaw process reaches it as localhost.
          # AOF data lives under the cached ~/.openclaw so queue state survives ticks.
          if [ "${OPENCLAW_ENABLE_REDIS}" = "true" ]; then
            echo "Starting Redis (redis:7-alpine)..."
            mkdir -p "$HOME/.openclaw/redis-data"
            docker run -d --name openclaw-redis \
              --user "$(id -u):$(id -g)" \
              -p 127.0.0.1:6379:6379 \
              -v "$HOME/.openclaw/redis-data:/data" \
              redis:7-alpine \
              redis-server --appendonly yes --dir /data
            echo "Waiting for Redis to answer PING..."
            for _ in $(seq 1 30); do
              if docker exec openclaw-redis redis-cli ping 2>/dev/null | grep -q PONG; then
                echo "Redis is healthy."; break
              fi
              sleep 1
            done
            { echo "REDIS_HOST=127.0.0.1"; echo "REDIS_PORT=6379"; } >> "$GITHUB_ENV"
          else
            echo "Redis disabled (OPENCLAW_ENABLE_REDIS=${OPENCLAW_ENABLE_REDIS})."
          fi

          # SearXNG — private metasearch backend for OpenClaw's searxng-search MCP.
          # Needs settings.yml (JSON format enabled) mounted from the checked-out repo,
          # which is why this runs as a post-checkout step rather than a service container.
          if [ "${OPENCLAW_ENABLE_SEARXNG}" = "true" ]; then
            settings="$GITHUB_WORKSPACE/searxng/settings.yml"
            if [ ! -f "$settings" ]; then
              echo "::warning::searxng/settings.yml not found — skipping SearXNG."
            else
              echo "Starting SearXNG (searxng/searxng:latest)..."
              docker run -d --name searxng \
                -p 8080:8080 \
                -v "$settings:/etc/searxng/settings.yml:ro" \
                searxng/searxng:latest
              echo "Waiting for SearXNG /healthz..."
              for _ in $(seq 1 30); do
                if curl -fsS --max-time 3 http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
                  echo "SearXNG is healthy."; break
                fi
                sleep 2
              done
              # Seeded MCP config points at http://172.17.0.1:8080 (docker0 gateway),
              # which the host process also reaches. Export SEARXNG_URL too for any
              # consumer that reads it from the environment.
              echo "SEARXNG_URL=http://127.0.0.1:8080" >> "$GITHUB_ENV"
            fi
          else
            echo "SearXNG disabled (OPENCLAW_ENABLE_SEARXNG=${OPENCLAW_ENABLE_SEARXNG})."
          fi

          # CRW — Code Ready Workspace (collaborative development environment).
          # Published on loopback:3000 so OpenClaw can reach it as localhost.
          echo "Starting CRW (ghcr.io/us/crw:latest)..."
          docker run -d --name openclaw-crw \
            -p 127.0.0.1:3000:3000 \
            ghcr.io/us/crw:latest
          echo "Waiting for CRW to be healthy..."
          for _ in $(seq 1 30); do
            if docker exec openclaw-crw wget -q --spider http://localhost:3000 2>/dev/null; then
              echo "CRW is healthy."; break
            fi
            sleep 1
          done
          { echo "CRW_HOST=127.0.0.1"; echo "CRW_PORT=3000"; } >> "$GITHUB_ENV"

      - name: Inject secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          # Export non-empty secrets to the job env for the run step below.
          # OpenClaw reads GROQ_API_KEY / OPENCLAW_GATEWAY_TOKEN from the environment.
          if [ -n "${GROQ_API_KEY:-}" ]; then
            echo "::add-mask::$GROQ_API_KEY"
            echo "GROQ_API_KEY=$GROQ_API_KEY" >> "$GITHUB_ENV"
          fi
          if [ -n "${OPENCLAW_GATEWAY_TOKEN:-}" ]; then
            echo "::add-mask::$OPENCLAW_GATEWAY_TOKEN"
            echo "OPENCLAW_GATEWAY_TOKEN=$OPENCLAW_GATEWAY_TOKEN" >> "$GITHUB_ENV"
          fi

      - name: Run OpenClaw cron tick
        run: |
          chmod +x .github/scripts/run-openclaw-cron.sh
          .github/scripts/run-openclaw-cron.sh
        env:
          OPENCLAW_BIN: openclaw

      - name: Stop sidecars
        if: always()
        run: |
          # Graceful stop lets Redis flush its AOF before the cache is saved.
          for c in searxng openclaw-redis openclaw-crw; do
            if [ -n "$(docker ps -aq -f name=^${c}$)" ]; then
              echo "Stopping ${c}..."
              docker stop "${c}" >/dev/null 2>&1 || true
              docker rm "${c}" >/dev/null 2>&1 || true
            fi
          done

      - name: Notify Telegram
        if: always() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          RUN_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$RUN_STATUS" = "success" ]; then icon="✅"; else icon="🔴"; fi
          text="${icon} OpenClaw runtime tick: ${RUN_STATUS}
          ${RUN_URL}"
          curl -fsS --max-time 15 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "disable_web_page_preview=true" >/dev/null || \
            echo "Telegram notification failed (non-fatal)."
