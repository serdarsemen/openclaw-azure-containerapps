x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

networks:
  openclaw-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.240.0/24

volumes:
  redis-data:
    driver: local
  openclaw-runtime-deps:
    driver: local
  openclaw-compile-cache:
    driver: local
  firecrawl-mcp-cache:
    driver: local

services:
  redis:
    image: redis:7-alpine
    container_name: openclaw-redis
    networks:
      - openclaw-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:18789:18789"
      - "127.0.0.1:18790:18790"
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - volatile-lru
      - --dir
      - /data
    restart: unless-stopped
    logging: *default-logging
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
          pids: 128
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  openclaw:
    image: openclaw-source:latest
    container_name: openclaw
    network_mode: "service:redis"
    depends_on:
      redis:
        condition: service_healthy
      ollama-windows-proxy:
        condition: service_healthy
    environment:
      - OPENCLAW_GATEWAY_TOKEN=7d7e3ec1422a7b0593842868113fed448b8d268715aa218d83dda37d97bf87ea
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=6144
      - HOME=/home/node
      - TERM=xterm-256color
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
      - CRW_HOST=localhost
      - CRW_PORT=3000
      - OLLAMA_HOST=http://host.docker.internal:11435
      - OPENCLAW_DISABLE_BONJOUR=true
      - NPM_CONFIG_RESOLUTION_MODE=highest
      - npm_config_resolution_mode=highest
      - OPENCLAW_BUNDLED_PLUGINS_DIR=/app/dist/extensions
    volumes:
      # Use the resolved Linux-side (ext4) path to preserve secure permissions.
      # Avoid /mnt/c/... because DrvFS can surface 0777 and trigger security checks.
      - /home/serdar/.openclaw-data:/home/node/.openclaw
      - openclaw-runtime-deps:/home/node/.openclaw/plugin-runtime-deps
      - openclaw-compile-cache:/home/node/.openclaw/compile-cache
    init: true
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 90s
    pids_limit: 512
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 12G
          pids: 512
        reservations:
          cpus: '2'
          memory: 4G
    command:
      - bash
      - -c
      - >-
        umask 077 && find /home/node/.openclaw/plugin-runtime-deps -maxdepth 2 -name '.openclaw-runtime-deps.lock' -type d -exec rm -rf {} + 2>/dev/null || true && npm config set prefix $$HOME/.openclaw/npm-global && export PATH=$$HOME/.openclaw/npm-global/bin:$$PATH && mkdir -p $$HOME/.local/node_modules/.bin && [ -x $$HOME/.openclaw/npm-global/bin/mslearn ] || npm install -g @microsoft/learn-cli >/dev/null 2>&1 || true && if [ -x $$HOME/.openclaw/npm-global/bin/mslearn ]; then ln -sf $$HOME/.openclaw/npm-global/bin/mslearn $$HOME/.local/node_modules/.bin/mslearn; fi && chmod -R 755 /app/dist/extensions && mkdir -p /home/node/.openclaw/workspace/memory && export NODE_COMPILE_CACHE=$$HOME/.openclaw/compile-cache && mkdir -p $$HOME/.openclaw/compile-cache && ( ( permission_status=0; ( (if [ ! -f '/home/node/.openclaw/.permissions-v1' ]; then find '/home/node/.openclaw' -path '/home/node/.openclaw/logs/restarts' -prune -o \( -type d ! -perm 700 -exec chmod 700 {} + \) -o \( -type f \( -name 'auth-*.json' -o -name 'sessions.json' -o -name 'openclaw.json' \) ! -perm 600 -exec chmod 600 {} + \) && (touch '/home/node/.openclaw/.permissions-v1' && chmod 600 '/home/node/.openclaw/.permissions-v1' || printf 'Permission marker could not be saved\n' >&2); fi) ) || permission_status=1; ( find '/home/node/.openclaw' -maxdepth 1 \( -type d ! -perm 700 -exec chmod 700 {} + \) -o \( -type f \( -name 'auth-*.json' -o -name 'sessions.json' -o -name 'openclaw.json' \) ! -perm 600 -exec chmod 600 {} + \) ) || permission_status=1; ( (if [ -d '/home/node/.openclaw/credentials' ]; then find '/home/node/.openclaw/credentials' \( -name node_modules -o -name .git -o -name compile-cache \) -prune -o \( -type d ! -perm 700 -exec chmod 700 {} + \) -o \( -type f \( -name 'auth-*.json' -o -name 'sessions.json' -o -name 'openclaw.json' \) ! -perm 600 -exec chmod 600 {} + \); fi) ) || permission_status=1; ( (if [ -d '/home/node/.openclaw/identity' ]; then find '/home/node/.openclaw/identity' \( -name node_modules -o -name .git -o -name compile-cache \) -prune -o \( -type d ! -perm 700 -exec chmod 700 {} + \) -o \( -type f \( -name 'auth-*.json' -o -name 'sessions.json' -o -name 'openclaw.json' \) ! -perm 600 -exec chmod 600 {} + \); fi) ) || permission_status=1; ( (if [ -d '/home/node/.openclaw/devices' ]; then find '/home/node/.openclaw/devices' \( -name node_modules -o -name .git -o -name compile-cache \) -prune -o \( -type d ! -perm 700 -exec chmod 700 {} + \) -o \( -type f \( -name 'auth-*.json' -o -name 'sessions.json' -o -name 'openclaw.json' \) ! -perm 600 -exec chmod 600 {} + \); fi) ) || permission_status=1; ( (if [ -d '/home/node/.openclaw/agents' ]; then find '/home/node/.openclaw/agents' \( -name node_modules -o -name .git -o -name compile-cache \) -prune -o \( -type d ! -perm 700 -exec chmod 700 {} + \) -o \( -type f \( -name 'auth-*.json' -o -name 'sessions.json' -o -name 'openclaw.json' \) ! -perm 600 -exec chmod 600 {} + \); fi) ) || permission_status=1; exit "$$permission_status" ) ) && export OPENCLAW_NO_RESPAWN=1 && node openclaw.mjs gateway --allow-unconfigured --bind lan --port 18789
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    networks:
      - openclaw-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    # SearXNG metasearch engine — reachable from openclaw at http://searxng:8080
    # (openclaw shares redis's netns on openclaw-net, so service DNS resolves).
    # settings.yml enables the JSON result format that openclaw's MCP server needs.
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
    logging: *default-logging
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
          pids: 256
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  crw:
    image: ghcr.io/us/crw:latest
    container_name: openclaw-crw
    networks:
      - openclaw-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    environment:
      # LLM extraction via Ollama
      - CRW_EXTRACTION__LLM__PROVIDER=openai-compatible
      - CRW_EXTRACTION__LLM__BASE_URL=http://host.docker.internal:11435/v1
      - CRW_EXTRACTION__LLM__API_KEY=key
      - CRW_EXTRACTION__LLM__MODEL=qwen3:8b
      # Search via SearXNG
      - CRW_SEARCH__SEARXNG_URL=http://searxng:8080
    # CRW (Code Ready Workspace) — collaborative development environment.
    # Reachable from openclaw at http://crw:3000 via the openclaw-net bridge.
    restart: unless-stopped
    logging: *default-logging
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
          pids: 128
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "grep -qi ':0BB8 ' /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  restart-monitor:
    image: docker:27-cli
    container_name: openclaw-restart-monitor
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/openclaw-restart-monitor.sh:/usr/local/bin/openclaw-restart-monitor.sh:ro
      - /home/serdar/.openclaw-data:/diagnostics
    command:
      - sh
      - -c
      - >-
        rm -f /diagnostics/logs/restarts/monitor.pid &&
        exec /bin/sh /usr/local/bin/openclaw-restart-monitor.sh
        'openclaw' /diagnostics/logs/restarts
    restart: unless-stopped
    logging: *default-logging
    pids_limit: 32
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
          pids: 32
        reservations:
          cpus: '0.02'
          memory: 32M
  firecrawl-mcp:
    image: node:22-slim
    container_name: openclaw-firecrawl-mcp
    networks:
      - openclaw-net
    env_file:
      - /home/serdar/.openclaw-data/firecrawl-mcp.env
    environment:
      - HTTP_STREAMABLE_SERVER=true
      - HOST=0.0.0.0
      - PORT=3000
      - LOG_LEVEL=warn
    volumes:
      - firecrawl-mcp-cache:/root/.npm
    command: ["npx", "-y", "firecrawl-mcp"]
    restart: unless-stopped
    logging: *default-logging
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
          pids: 128
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/mcp').then((r)=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
  ollama-windows-proxy:
    image: openclaw-source:latest
    container_name: openclaw-ollama-windows-proxy
    network_mode: host
    command:
      - node
      - -e
      - >-
        const net = require('node:net');
        net.createServer((client) => {
          const upstream = net.connect(11434, '127.0.0.1');
          client.pipe(upstream);
          upstream.pipe(client);
          const close = () => { client.destroy(); upstream.destroy(); };
          client.on('error', close);
          upstream.on('error', close);
        }).listen(11435, '0.0.0.0');
    init: true
    restart: unless-stopped
    logging: *default-logging
    pids_limit: 128
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:11435/api/tags').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
