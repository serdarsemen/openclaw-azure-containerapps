networks:
  openclaw-net:
    driver: bridge

volumes:
  redis-data:
    driver: local
  openclaw-runtime-deps:
    driver: local
  openclaw-compile-cache:
    driver: local

services:
  openclaw:
    image: openclaw-source:latest
    container_name: openclaw
    networks:
      - openclaw-net
        extra_hosts:
            - "host.docker.internal:host-gateway"
    environment:
      - OPENCLAW_GATEWAY_TOKEN=43c251a712c1dd2824ae1d91ac514b2795070b2d89a7b6c9960bcecc2b4d67c7
      - NODE_ENV=production
      - HOME=/home/node
      - TERM=xterm-256color
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OPENCLAW_DISABLE_BONJOUR=true
      - NPM_CONFIG_RESOLUTION_MODE=highest
      - npm_config_resolution_mode=highest
      - OPENCLAW_BUNDLED_PLUGINS_DIR=/app/dist/extensions
    volumes:
      - /mnt/c/app/openclaw-azure-containerapps/openclaw-data:/home/node/.openclaw
      - openclaw-runtime-deps:/home/node/.openclaw/plugin-runtime-deps
      - openclaw-compile-cache:/home/node/.openclaw/compile-cache
    ports:
      - "18789:18789"
      - "18790:18790"
    init: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6G
        reservations:
          cpus: '2'
          memory: 4G
    command:
      - bash
      - -c
      - >-
        find /home/node/.openclaw/plugin-runtime-deps -maxdepth 2 -name '.openclaw-runtime-deps.lock' -type d -exec rm -rf {} + 2>/dev/null || true && chmod -R 755 /app/dist/extensions && mkdir -p /home/node/.openclaw/workspace/memory && export NODE_COMPILE_CACHE=$$HOME/.openclaw/compile-cache && mkdir -p $$HOME/.openclaw/compile-cache && chmod 600 /home/node/.openclaw/agents/main/sessions/sessions.json 2>/dev/null || true && export OPENCLAW_NO_RESPAWN=1 && node openclaw.mjs gateway --allow-unconfigured --bind lan --port 18789
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: openclaw-redis
    networks:
      - openclaw-net
        ports:
            - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --dir
      - /data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
